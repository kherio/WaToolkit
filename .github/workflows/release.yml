name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Get version and SHA
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(sed -n 's/^val baseVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null | cut -d- -f1 || true)
          VERSION=$BASE
          if [ -n "$LATEST" ]; then
            NEXT="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
            # Use the higher of the base version in the code and the one after the latest release
            VERSION=$(printf '%s\n%s\n' "$BASE" "$NEXT" | sort -V | tail -n 1)
          fi
          SHA8=$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHA8" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes come from the commit titles (squash-merged PR titles) since the previous release.
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          PREV_SHA="${PREV_TAG##*-}"
          if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null; then
            RANGE="$PREV_SHA..HEAD"
          else
            RANGE="-n 20"
          fi
          git log --no-merges --pretty=format:%s $RANGE > subjects.txt || true
          clean() { sed -E 's/^[a-z]+(\([^)]*\))?!?: *//; s/ *\(#[0-9]+\)$//; s/^./\U&/; s/^/- /'; }
          : > release-notes.txt
          section() { # title, regex of commit types
            LINES=$(grep -E "^($2)(\([^)]*\))?!?:" subjects.txt | clean || true)
            if [ -n "$LINES" ]; then printf '### %s\n\n%s\n\n' "$1" "$LINES" >> release-notes.txt; fi
          }
          section "New" "feat"
          section "Fixed" "fix"
          section "Improved" "perf|refactor|chore"
          if [ ! -s release-notes.txt ]; then echo "- Maintenance release" > release-notes.txt; fi
          cat release-notes.txt

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all variants
        run: ./gradlew assembleWhatsappDebug -Pminify=true -PappVersion=${{ steps.vars.outputs.version }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaToolkit ${{ steps.vars.outputs.version }}
          body_path: release-notes.txt
          files: |
            app/build/outputs/apk/whatsapp/debug/WaToolkit*.apk
          tag_name: ${{ steps.vars.outputs.tag }}
